# Empresa fictícia do cenário 01 — RASCUNHO para K03 (Refs #3).
#
# Descreve os FATOS de negócio da transportadora fictícia. Alimenta:
#   - o gerador de fontes sintéticas (próxima branch);
#   - a persona da entrevista simulada da frente de Contexto (P1/K04), para que
#     entrevista e dados contem a mesma história.
# NÃO define regras de KPI: tratamento de duplicata, cancelamento, rateio,
# completude e ocupação depende de K02. Onde aparece "regra_pendente_k02",
# o gerador só planta o fato; a interpretação é do plano aprovado.
#
# Toda grandeza tem `origem`:
#   calibracao:<id>   -> agregado de fonte pública (ver calibration/calibration.yaml)
#   suposicao:equipe  -> escolha da equipe, sem fonte; revisar com P1/entrevistas
#   entrevista:<ref>  -> informação vinda de entrevista (nenhuma ainda)
# Nenhuma pessoa ou empresa real deve ser identificável.

versao: 0.1-rascunho
cenario: "01"
semente: 20261122

empresa:
  razao_social: "TransKorda Logística Ltda (fictícia)"
  cnpj: {regra: "14 dígitos com dígito verificador propositalmente inválido, para não coincidir com CNPJ real", origem: suposicao:equipe}
  segmento: "transporte rodoviário de carga fracionada B2B, distribuição regional"
  sede: {codigo_ibge: 3509502, municipio: Campinas, uf: SP, origem: suposicao:equipe}
  area_atendimento: {arquivo: spec/area_atendimento.csv, origem: suposicao:equipe}
  fuso_horario: America/Sao_Paulo
  sistemas: [ERP, TMS, CT-e]

periodo:
  inicio: 2026-08-03
  dias_corridos: 60
  dias_operacao: "segunda a sábado; sábado com 40% do volume"
  feriados: {regra: "sem feriados no cenário 01", origem: suposicao:equipe}
  origem: suposicao:equipe

volumes_alvo:          # ordens de grandeza, não metas exatas
  clientes: {valor: 40, origem: suposicao:equipe}
  pedidos: {valor: 1500, origem: suposicao:equipe}
  viagens: {valor: 300, nota: "≈5 entregas por viagem (rota com múltiplas paradas)", origem: suposicao:equipe}
  ctes_autorizados: {valor: 920, nota: "decorre de pedidos_por_cte", origem: suposicao:equipe}

frota:
  origem: suposicao:equipe
  conferir_com: calibracao:antt_rntrc_veiculos   # pendente: fonte indisponível em 22/11/2026
  veiculos:
    - {tipo: VUC,   quantidade: 3, capacidade_kg: 3000,  capacidade_m3: 15, consumo_km_l: 8.0}
    - {tipo: toco,  quantidade: 3, capacidade_kg: 6000,  capacidade_m3: 35, consumo_km_l: 5.0}
    - {tipo: truck, quantidade: 2, capacidade_kg: 12000, capacidade_m3: 50, consumo_km_l: 3.8}

custos_operacao:
  diesel_r_por_litro: {ref: calibration.yaml#diesel_preco_medio_consumidor.valor_uf_sede, ano: 2025, origem: calibracao:anp_anuario_2026_t3_21}
  fator_estrada: {valor: 1.25, nota: "km de estrada = km em linha reta × fator", origem: suposicao:equipe}
  distancias: {ref: calibration.yaml#distancias_da_sede, origem: calibracao:kelvins_municipios}

pedido:
  peso_bruto_kg: {distribuicao: lognormal, mediana: 600, p95: 2500, maximo: 4000, origem: suposicao:equipe}
  densidade_kg_m3: {valor: 180, nota: "volume = peso / densidade", origem: suposicao:equipe}
  itens_por_pedido: {distribuicao: "1 + poisson(4)", origem: suposicao:equipe}
  valor_mercadoria_r_por_kg: {mediana: 45, origem: suposicao:equipe}
  prazo_prometido: {ate_100_km: "D+1 útil", acima_100_km: "D+2 úteis", origem: suposicao:equipe}

frete:   # tabela da transportadora; vira vTPrest do CT-e
  origem: suposicao:equipe
  r_por_kg_por_faixa_km_estrada: {"0-50": 0.35, "50-100": 0.50, "100-300": 0.80}
  frete_minimo_r: 120.00
  ad_valorem_pct_valor_mercadoria: 0.30
  pedidos_por_cte: {"1": 0.60, "2": 0.25, "3-4": 0.15, nota: "pedidos do mesmo cliente e mesmo embarque no mesmo CT-e", origem: suposicao:equipe}

anomalias:     # taxas sobre o total relevante; detalhes em spec/anomalias.md
  origem: suposicao:equipe
  cte_duplicado_pct: 3        # mesmo chCTe aparece duas vezes na carga do cliente
  cte_cancelado_pct: 4        # evento 110111 homologado
  cte_cancelado_reemitido_pct: 50   # dos cancelados, quantos ganham CT-e substituto (regra_pendente_k02)
  cte_multi_pedido_pct: 40    # CT-e com 2+ pedidos -> exige rateio (regra_pendente_k02)
  entrega_incompleta_pct: 6   # qt_entregue < qt_itens
  entrega_atrasada_pct: 12    # dt_baixa > dt_prev_ent
  entrega_sem_data_realizada_pct: 2
  data_formato_misto_pct: 10  # em entregas.dt_baixa
  viagem_acima_capacidade_pct: 1   # carga declarada > capacidade (erro de cadastro plausível)
