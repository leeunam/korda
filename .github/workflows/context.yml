name: Interview context backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: context_test
          POSTGRES_PASSWORD: context_ci_disposable
          POSTGRES_DB: context_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U context_test -d context_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CONTEXT_TEST_DATABASE_URL: postgresql://context_test:context_ci_disposable@localhost:5432/context_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reproducible backend
        run: |
          python -m pip install uv==0.13.10
          uv sync --locked --project services/context
      - name: Backend, real PostgreSQL and consumer mechanics
        run: uv run --locked --project services/context python -m pytest services/context/tests evaluation/discovery_v02/tests -q
      - name: Preserve context v0.1 and validate v0.2 examples
        run: |
          uv run --locked --project services/context python -m unittest discover -s packages/contracts/context/v0.1.0/tests
          uv run --locked --project services/context python packages/contracts/context/v0.2.0/validate.py packages/contracts/context/v0.2.0/examples/*.json
          python scripts/check_repo.py
