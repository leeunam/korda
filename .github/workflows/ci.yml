name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-17
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-17
        with:
          python-version: '3.11'
      - name: Validate scaffold
        run: python3 scripts/check_repo.py
      - name: Validate context contract and examples
        run: |
          python3 -m pip install -r requirements-contracts.txt
          python3 -m unittest discover -s packages/contracts/context/v0.1.0/tests
      - name: Validate discovery fixtures and semantic acceptance
        run: |
          python3 -m pip install -r requirements-discovery.txt
          python3 data/synthetic/discovery/validate.py
          python3 -m pytest evaluation/discovery/tests -q

  synthetic:
    name: Synthetic data and golden checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-17
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-17
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements-synthetic.txt
      - name: Unit tests (calibration, generator, golden)
        run: |
          python3 -m unittest discover -s data/synthetic/calibration/tests
          python3 -m unittest discover -s data/synthetic/generator/tests
          python3 -m unittest discover -s evaluation/golden/tests
      - name: Generate all companies and validate every CT-e against the XSD
        run: |
          python3 data/synthetic/generator/generate.py --all
          python3 data/synthetic/generator/validate_xsd.py --all
      - name: Golden must match the regenerated sources
        run: |
          python3 evaluation/golden/compute_golden.py --all
      - name: Each correction must move its KPI beyond tolerance
        run: python3 evaluation/golden/sensitivity.py --all
      - name: All golden outputs must match (including sensitivity)
        run: git diff --exit-code -- evaluation/golden

  execution:
    name: Execution sandbox (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-17
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-17
        with:
          python-version: '3.11'
      - name: Build sandbox image
        run: docker build -t korda-sandbox:dev infra/sandbox
      - name: Unit and integration tests (skipping is a failure here)
        env:
          KORDA_EXIGIR_DOCKER: '1'
        run: python3 -m unittest discover -s services/execution/tests -t services/execution -v

  simulated:
    name: Simulated client systems (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-17
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-17
        with:
          python-version: '3.11'
      - name: Build simulator image and pull Postgres
        run: |
          docker build -t korda-simulados:dev infra/sistemas-simulados
          docker pull postgres:17.6-alpine
      - name: Unit tests inside the image (no network)
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp
          --user "$(id -u):$(id -g)" -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD/infra/sistemas-simulados:/src:ro" -e PYTHONPATH=/src
          korda-simulados:dev python -m unittest discover -s /src/tests -v
      - name: Generate tuning companies (03_reservada stays out of CI)
        run: |
          python3 -m pip install -r requirements-synthetic.txt
          python3 data/synthetic/generator/generate.py --empresa 01_demo
          python3 data/synthetic/generator/generate.py --empresa 02_variacao
      - name: Integration tests against the generated sources (skipping is a failure here)
        env:
          KORDA_EXIGIR_DOCKER: '1'
          PYTHONPATH: infra/sistemas-simulados
        run: python3 -m unittest discover -s infra/sistemas-simulados/tests -v

  ingestion-plan:
    name: Ingestion plan contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-17
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-17
        with:
          python-version: '3.11'
      - name: Validate examples and rules
        run: |
          python3 -m pip install -r requirements-contracts.txt
          python3 -m unittest discover -s packages/contracts/ingestion_plan/v0.1.0/tests -v
          python3 packages/contracts/ingestion_plan/v0.1.0/validate.py packages/contracts/ingestion_plan/v0.1.0/examples/*.json
