[project]
name = "korda-context"
version = "0.2.0"
description = "Entrevista WhatsApp e contexto versionado da Korda"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.12,<3",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2",
  "sqlalchemy>=2.0,<3", "procrastinate>=3,<4", "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["korda_context"]

[project.scripts]
contextctl = "korda_context.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires CONTEXT_TEST_DATABASE_URL"]
